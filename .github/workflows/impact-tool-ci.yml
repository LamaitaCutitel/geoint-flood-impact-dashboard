name: Impact tool CI

on:
  push:
    branches:
      - feature/new-flood-impact-tool
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Clean import
        run: |
          python -c "import impact_tool"
          python -c "import src.impact_tool.analysis, src.impact_tool.dynamic_world, src.impact_tool.osm, src.impact_tool.report"

      - name: Run tests
        run: python -m pytest -q

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          python -m streamlit run impact_tool.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 > streamlit-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit-smoke.log
          exit 1
